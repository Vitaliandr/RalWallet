[project]
name = "ralwallet"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E262", "E265", "E266"]

[tool.ruff.lint.per-file-ignores]
#в conftest импорты после env специально
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# Depends() в дефолтах это норм для fastapi
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["ralwallet", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["ralwallet", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
#в тестах аннотации не требуем
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# у них нет типов
module = ["aiokafka", "aiokafka.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ralwallet"]
branch = true
#без greenlet coverage не видит половину кода (async sqlalchemy)
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
