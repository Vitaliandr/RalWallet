name: ralwallet

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://wallet:wallet@postgres:5432/wallet
  REDIS_URL: redis://redis:6379/0
  KAFKA_SERVERS: kafka:9092
  # без секрета не стартуем
  JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в файле .env, см. .env.example}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    #только локально, наружу базу не светим
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"  # у redis нет пароля

  #kafka в режиме KRaft без zookeeper
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      #брокер один, значит и репликация 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9094:9094"

  api:
    build: .
    environment: *app-env
    command: sh -c "alembic upgrade head && uvicorn ralwallet.main:app --host 0.0.0.0 --port 8000"
    # для доступа из сети: "8080:8000"
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  relay:
    build: .
    environment: *app-env
    command: python -m ralwallet.background.outbox_sender
    depends_on:
      - api
      - kafka

  notifier:
    build: .
    environment: *app-env
    command: python -m ralwallet.background.notify
    depends_on:
      - kafka
      - redis

volumes:
  pgdata:
